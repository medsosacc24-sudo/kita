<!DOCTYPE html>
<html lang="ms"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6F61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kita">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Kita</title>
<style>
:root{--c:#FF6F61;--t:#1FB5A6;--y:#F4A100;--v:#7B61FF;--bg:#FFFAF5;--tx:#26283A;--mu:#8A8DA0}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:18px 16px}
h1{font-size:26px;margin-bottom:14px}
h2{font-size:15px;color:var(--mu);margin:22px 0 8px;font-weight:600}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;border-left:5px solid var(--a,var(--c))}
.hero{background:var(--c);color:#fff;border:0;border-radius:28px;text-align:center;padding:30px 16px}
.hero b{display:block;font-size:64px;font-weight:800;line-height:1.05}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:color-mix(in srgb,var(--a,var(--c)) 14%,white);color:var(--a,var(--c));border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0;font:inherit;font-size:11px;color:var(--mu)}
nav button.on{color:var(--c);font-weight:700}
input,textarea,.b{width:100%;font:inherit;padding:12px;border:1px solid #e8e2dc;border-radius:12px;margin-bottom:10px;background:#fff;color:var(--tx)}
textarea{min-height:120px}
.b{background:var(--c);color:#fff;border:0;font-weight:700}
.g{background:#efeae5;color:var(--tx)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--t);color:#fff;font-size:32px;box-shadow:0 4px 14px #0003}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px;margin:auto}
small{color:var(--mu)} pre{white-space:pre-wrap;font:inherit;font-size:14px;color:var(--mu)}
a{color:var(--t)}
</style></head>
<body><main id="app"></main><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WED=new Date(2018,2,18);
const K={
 event:{n:'Tarikh',a:'--c',f:[['title','Tajuk (cth: Hari lahir isteri)'],['date','Tarikh (berulang setiap tahun)','date']]},
 recipe:{n:'Resepi',a:'--y',f:[['title','Nama resepi'],['link','Link sumber (pilihan)'],['body','Bahan dan langkah (salin dari post)','t']]},
 wish:{n:'Wishlist',a:'--t',f:[['title','Impian (cth: Jepun, kayak)'],['body','Nota','t']]},
 bill:{n:'Bil',a:'--v',f:[['title','Nama bil'],['day','Bayar pada hari ke- setiap bulan (1-31)','number'],['body','Rekod bayaran (cth: Nov 2026 - RM120)','t']]}
};
let tab='home',items=[],sheet;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const diff=(a,b)=>Math.round((a-b)/864e5);
const when=n=>{const k=diff(n,today());return k==0?'Hari ini!':k==1?'Esok':k+' hari lagi'};
function nxt(i){const t=today(),d=i.data;let n;
 if(i.kind=='event'){if(!d.date)return;const o=new Date(d.date+'T00:00');n=new Date(t.getFullYear(),o.getMonth(),o.getDate());if(n<t)n.setFullYear(n.getFullYear()+1)}
 else if(i.kind=='bill'){const x=+d.day;if(!x)return;n=new Date(t.getFullYear(),t.getMonth(),x);if(n<t)n=new Date(t.getFullYear(),t.getMonth()+1,x)}
 return n}

async function init(){const{data:{session}}=await db.auth.getSession();session?load():login()}
function login(){$('#nav').innerHTML='';$('#app').innerHTML=`<h1>Kita</h1><div class=card><input id=e type=email placeholder="Emel"><input id=p type=password placeholder="Kata laluan"><button class=b id=go>Masuk</button><small id=m></small></div>`;
 $('#go').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});error?$('#m').textContent='Emel atau kata laluan salah.':load()}}
async function load(){const{data}=await db.from('items').select('*').order('created_at',{ascending:false});items=data||[];draw()}
function draw(){
 $('#nav').innerHTML=[['home','🏠','Utama'],['event','📅','Tarikh'],['photo','📷','Gambar'],['recipe','🍳','Resepi'],['wish','✈️','Wishlist'],['bill','💳','Bil']].map(([k,i,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';draw()">${i}<br>${n}</button>`).join('');
 tab=='home'?home():tab=='photo'?photos():list(tab)}

function home(){const days=diff(today(),WED);
 const all=[...items,{kind:'event',data:{title:'Ulang tahun perkahwinan',date:'2018-03-18'}}];
 const up=all.map(i=>({i,n:nxt(i)})).filter(x=>x.n).sort((a,b)=>a.n-b.n).slice(0,6);
 $('#app').innerHTML=`<div class="card hero"><div>Kita dah berkahwin</div><b>${days.toLocaleString('en-US')}</b><div>hari</div></div><h2>Akan datang</h2>`+
 (up.map(x=>`<div class="card row" style="--a:var(${K[x.i.kind].a})"><span>${esc(x.i.data.title)}<br><small>${K[x.i.kind].n}</small></span><span class=pill>${when(x.n)}</span></div>`).join(''))+
 `<button class="b g" onclick="db.auth.signOut().then(login)">Log keluar</button>`}

function list(k){const c=K[k];
 $('#app').innerHTML=`<h1>${c.n}</h1>`+(items.filter(i=>i.kind==k).map(i=>{const n=nxt(i),d=i.data;
  return `<div class=card style="--a:var(${c.a})" onclick="openForm('${k}','${i.id}')"><div class=row><b>${esc(d.title)}</b>${n?`<span class=pill>${when(n)}</span>`:''}</div>`+
  (d.date?`<small>${d.date.split('-').reverse().join('/')}</small>`:'')+
  (/^https?:/.test(d.link||'')?`<br><a href="${esc(d.link)}" onclick="event.stopPropagation()">Buka sumber</a>`:'')+
  (d.body?`<pre>${esc(d.body.slice(0,110))}</pre>`:'')+`</div>`}).join('')||'<small>Belum ada apa-apa. Tekan + untuk tambah.</small>')+
  `<button class=fab onclick="openForm('${k}')">+</button>`}

function openForm(k,id){const it=items.find(x=>x.id==id),d=it?.data||{};
 sheet=document.createElement('div');sheet.className='sheet';
 sheet.innerHTML=`<div><h2>${it?'Ubah':'Tambah'} ${K[k].n.toLowerCase()}</h2>`+K[k].f.map(([f,p,t])=>`<small>${p}</small>`+(t=='t'?`<textarea id=f_${f}>${esc(d[f])}</textarea>`:`<input id=f_${f} type="${t||'text'}" value="${esc(d[f])}">`)).join('')+
 `<button class=b id=sv>Simpan</button>`+(k=='event'&&it?`<button class="b g" id=ics>Masukkan ke Kalendar iPhone</button>`:'')+(it?`<button class="b g" id=dl>Padam</button>`:'')+`<button class="b g" id=cl>Tutup</button></div>`;
 document.body.append(sheet);
 $('#cl').onclick=()=>sheet.remove();
 $('#sv').onclick=async()=>{const data={};K[k].f.forEach(([f])=>data[f]=$('#f_'+f).value.trim());
  if(!data.title||(k=='event'&&!data.date))return alert('Sila isi tajuk dan tarikh.');
  const r=it?await db.from('items').update({data}).eq('id',id):await db.from('items').insert({kind:k,data});
  if(r.error)return alert('Gagal simpan: '+r.error.message);sheet.remove();load()};
 if(it)$('#dl').onclick=async()=>{if(!confirm('Padam item ini?'))return;await db.from('items').delete().eq('id',id);sheet.remove();load()};
 if($('#ics'))$('#ics').onclick=()=>{const s=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Kita//MS\r\nBEGIN:VEVENT\r\nUID:${id}@kita\r\nDTSTAMP:20260101T000000Z\r\nDTSTART;VALUE=DATE:${d.date.replace(/-/g,'')}\r\nRRULE:FREQ=YEARLY\r\nSUMMARY:${d.title.replace(/[,;]/g,' ')}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Esok: ${d.title.replace(/[,;]/g,' ')}\r\nTRIGGER:-PT12H\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  location.href=URL.createObjectURL(new Blob([s],{type:'text/calendar'}))}}

const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.72)};i.src=URL.createObjectURL(f)});
async function photos(){
 $('#app').innerHTML=`<h1>Gambar</h1><div class=grid id=g></div><input id=up type=file accept="image/*" multiple hidden><button class=fab onclick="$('#up').click()">+</button>`;
 $('#up').onchange=async e=>{$('#g').innerHTML='<small>Memuat naik...</small>';for(const f of e.target.files){const b=await shrink(f);const{error}=await db.storage.from('photos').upload(Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.jpg',b,{contentType:'image/jpeg'});if(error)alert('Gagal: '+error.message)}photos()};
 const{data}=await db.storage.from('photos').list('',{limit:300,sortBy:{column:'created_at',order:'desc'}});
 const names=(data||[]).map(x=>x.name).filter(n=>n.endsWith('.jpg'));
 if(!names.length)return $('#g').outerHTML='<small>Belum ada gambar. Tekan + untuk muat naik.</small>';
 const{data:u}=await db.storage.from('photos').createSignedUrls(names,3600);
 $('#g').innerHTML=u.map(x=>`<img loading=lazy src="${x.signedUrl}" onclick="window.open(this.src)">`).join('')}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
init();
</script></body></html>
