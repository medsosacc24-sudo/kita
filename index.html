<!DOCTYPE html>
<html lang="ms"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9E0FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kita">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<title>Kita</title>
<style>
:root{--b:#8B6FE0;--b2:#ECE6FB;--bg1:#E9E0FA;--bg0:#FBF9FF;--h1:#C6B3F4;--h2:#E2B8EF;--h3:#F5C0DC;--ink:#2B2342;--mu:#766F8C}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 "DM Sans",system-ui,-apple-system,sans-serif;color:var(--ink);background-color:var(--bg0);background-image:linear-gradient(180deg,var(--bg1),var(--bg0) 380px);background-repeat:no-repeat;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(112px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:20px 18px}
h1,h2,.hero b{font-family:Fraunces,Georgia,serif}
h1{font-size:34px;line-height:1.1;font-weight:700;margin:4px 0 16px}
h2{font-size:24px;font-weight:700;margin:26px 0 12px}
.date{color:var(--mu);font-size:15px}
.card{background:#fff;border-radius:26px;padding:16px 18px;margin-bottom:12px;box-shadow:0 6px 22px #1b2a4a0f}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--h1),var(--h2) 55%,var(--h3));text-align:center;padding:36px 16px;border-radius:34px;box-shadow:0 14px 34px color-mix(in srgb,var(--b) 20%,transparent)}
.hero::after{content:"";position:absolute;right:-60px;top:-50px;width:230px;height:230px;border-radius:50%;background:#ffffff40}
.hero b{position:relative;z-index:1;display:block;font-size:74px;line-height:1.05;font-weight:700}
.hero span{position:relative;z-index:1}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ic{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--a) 15%,white);display:grid;place-items:center;font-size:20px;flex:none}
.pill{background:color-mix(in srgb,var(--a) 14%,white);color:var(--a);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:auto;display:flex;background:#fffffff2;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:34px;padding:6px;box-shadow:0 10px 30px #1b2a4a24}
nav button{flex:1;border:0;background:none;border-radius:26px;padding:8px 0;font:inherit;font-size:10.5px;color:var(--mu)}
nav button.on{background:var(--b2);color:var(--b);font-weight:700}
nav i{display:block;font-style:normal;font-size:19px}
input,textarea,select,.b{width:100%;font:inherit;padding:14px 16px;border:1px solid color-mix(in srgb,var(--b) 18%,white);border-radius:18px;margin-bottom:10px;background:#fff;color:var(--ink)}
.search{border:0;border-radius:99px;padding:15px 22px;box-shadow:0 4px 18px color-mix(in srgb,var(--b) 14%,transparent);margin-bottom:16px}
textarea{min-height:120px}
.b{background:var(--b);color:#fff;border:0;font-weight:700}
.g{background:var(--b2);color:var(--b)}
.fab{position:fixed;right:20px;bottom:calc(98px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:32px;box-shadow:0 8px 20px color-mix(in srgb,var(--b) 40%,transparent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}
.sheet{position:fixed;inset:0;background:#1b2a4a88;display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--bg0);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding:20px;margin:auto}
small{color:var(--mu)} pre{white-space:pre-wrap;font:inherit;font-size:14px;color:var(--mu)}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--b) 35%,white);background:#fff;flex:none;padding:0;display:grid;place-items:center;color:#fff;font-weight:700}
.chk.on{background:var(--b);border-color:var(--b)}
.av{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--b) 25%,white) center/cover;color:var(--b);display:grid;place-items:center;font-weight:700;flex:none}
.av.big{width:68px;height:68px;border:3px solid #fff;font-size:26px;margin:0 -8px}
.avs{position:relative;z-index:1;display:flex;justify-content:center;margin-bottom:10px}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -18px 14px;padding:4px 18px}
.chip{white-space:nowrap;background:#fff;border:0;border-radius:99px;padding:10px 18px;font:inherit;color:var(--mu);box-shadow:0 3px 12px #1b2a4a0d;flex:none}
.chip.on{background:var(--ink);color:#fff}
.sum{display:flex;gap:16px}.sum>div{flex:1}.sum small{display:block}.sum b{font:700 22px Fraunces,Georgia,serif}
.bar{height:12px;border-radius:9px;background:var(--b2);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--h1))}
.don{width:200px;height:200px;border-radius:50%;margin:10px auto;position:relative}.don::after{content:"";position:absolute;inset:36px;background:#fff;border-radius:50%}
.don span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1;font:700 20px Fraunces,Georgia,serif}
.sq{width:50px;height:50px;border-radius:16px;background:color-mix(in srgb,var(--a) 14%,white);display:grid;place-items:center;font-size:22px;flex:none;position:relative}
.sq u{position:absolute;top:-6px;right:-6px;font-size:11px;color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;text-decoration:none}
.fab.w{width:auto;border-radius:99px;padding:0 22px;font-size:16px;font-weight:700;background:var(--ink)}
.sel{outline:4px solid var(--b);outline-offset:-4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal>b{font-size:12px;color:var(--mu)}
.day{padding:8px 0;border-radius:14px;font-size:15px;cursor:pointer}.day.on{background:var(--b);color:#fff}.day.td{font-weight:700;color:var(--b)}.day.on.td{color:#fff}
.dots{display:flex;justify-content:center;gap:2px;height:6px;margin-top:2px}.dots i{width:6px;height:6px;border-radius:50%}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.tk .day.on{background:transparent;color:inherit;box-shadow:inset 0 0 0 2.5px var(--ink)}
.tk .day.we{background:#FFD3E4;color:#D6336C}
.tk .day.hol{background:#FFC98B;color:#B34700}
.tk .day.pay{background:#FF8F8F;color:#fff;font-weight:700}
.tk .day.td{text-decoration:underline}
.avrow{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.kav{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;color:#fff;background-size:cover;background-position:center;cursor:pointer;border:3px solid #fff;box-shadow:0 3px 10px color-mix(in srgb,var(--ink) 15%,transparent)}
.kav.on{box-shadow:0 0 0 3px var(--b)}.kav.all{background:var(--b2);color:var(--b);font-size:11px}.kav.add{background:#fff;color:var(--b);font-size:26px;font-weight:400}
.sw{position:relative;margin-bottom:12px;border-radius:26px;overflow:hidden}.sw .card{margin:0;position:relative;touch-action:pan-y}
.sw .tr{position:absolute;right:0;top:0;bottom:0;width:84px;border:0;background:#FF6B6B;color:#fff;font-size:24px}
a{color:var(--b);cursor:pointer}
</style></head>
<body><main id="app"></main><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WED=new Date(2018,2,18);
const RMD=['Tiada','Sehari sebelum (12 tengah hari)','Pagi hari itu (8 pagi)','Seminggu sebelum (12 tengah hari)','Satu jam sebelum (isi masa)'],KOL=['Biru','Merah jambu','Hijau','Oren','Ungu'];
const CAT=['Bil','Makanan','Pengangkutan','Anak','Lain-lain'],WC=['Melancong','Makanan','Barang','Aktiviti'],WE={Melancong:'✈️',Makanan:'🍜',Barang:'🛍️',Aktiviti:'🎈'};
const K={
 event:{n:'Tarikh',e:'📅',a:'var(--b)',f:[['title','Tajuk (cth: Hari lahir isteri)'],['date','Tarikh (berulang setiap tahun)','date']]},
 recipe:{n:'Resepi',e:'🍳',a:'#E59A00',f:[['title','Nama resepi'],['link','Link sumber (pilihan)'],['body','Bahan dan langkah (salin dari post)','t']]},
 wish:{n:'Impian',e:'✈️',a:'#14A99B',f:[['title','Impian (cth: Jepun, kayak)'],['cat','Kategori','s',WC],['target','Sasaran (RM)','number'],['saved','Sudah dikumpul (RM)','number'],['date','Tarikh sasaran','date'],['done','Status','s',['Belum','Sudah tercapai']],['body','Nota','t']]},
 bill:{n:'Bil',e:'💳',a:'#7B61FF',f:[['title','Nama bil'],['day','Bayar pada hari ke- setiap bulan (1-31)','number'],['body','Nota (pilihan)','t']]},
 task:{n:'Tugasan',e:'✅',a:'#22A06B',f:[['title','Tugasan (cth: Beli susu)'],['who','Untuk siapa','s']]},
 goal:{n:'Simpanan',e:'🎯',a:'var(--b)',f:[['title','Matlamat (cth: Jepun)'],['target','Sasaran (RM)','number'],['saved','Sudah disimpan (RM)','number'],['date','Tarikh sasaran','date']]},
 exp:{n:'Belanja',e:'🧾',a:'#7B61FF',f:[['title','Butiran'],['amt','Jumlah (RM)','number'],['cat','Kategori','s',CAT],['who','Dibayar oleh','s'],['date','Tarikh belanja','date']]},
 kid:{n:'Anak',e:'🧒',a:'#FF6F91',f:[['title','Nama anak'],['color','Warna','s',KOL],['photo','Gambar (pilihan)','p']]},
 kev:{n:'Program',e:'🎒',a:'#FF6F91',f:[['title','Program / aktiviti (cth: Sukan tahunan)'],['kid','Anak','s','kids'],['date','Tarikh program','date'],['time','Masa (pilihan)','time'],['remind','Peringatan','s',RMD],['body','Nota (bawa apa, pakai apa)','t']]},
 sv:{n:'Simpanan',e:'💰',a:'#22A06B',f:[['title','Jenis simpanan (cth: Simpanan bulanan)'],['amt','Jumlah (RM). Guna tanda - untuk keluarkan','number'],['date','Tarikh simpan','date'],['who','Disimpan oleh','s'],['note','Nota (pilihan)']]}
};
let tab='home',items=[],sheet,uid,poll;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const diff=(a,b)=>Math.round((a-b)/864e5);
const when=n=>{const k=diff(n,today());return k==0?'Hari ini!':k==1?'Esok':k+' hari lagi'};
function nxt(i){const t=today(),d=i.data;let n;
 if(i.kind=='event'){if(!d.date)return;const o=new Date(d.date+'T00:00');n=new Date(t.getFullYear(),o.getMonth(),o.getDate());if(n<t)n.setFullYear(n.getFullYear()+1)}
 else if(i.kind=='kev'){if(!d.date)return;n=new Date(d.date+'T00:00');if(n<t)return}
 else if(i.kind=='bill'){const x=+d.day;if(!x)return;n=new Date(t.getFullYear(),t.getMonth(),x);if(n<t||(d.pays||[]).some(p=>p.d.startsWith(iso(t).slice(0,7))))n=new Date(t.getFullYear(),t.getMonth()+1,x)}
 return n}

async function init(){const{data:{session}}=await db.auth.getSession();uid=session?.user.id;session?load():login()}
function login(){$('#nav').innerHTML='';$('#app').innerHTML=`<h1>Kita</h1><div class=card><input id=e type=email placeholder="Emel"><input id=p type=password placeholder="Kata laluan"><button class=b id=go>Masuk</button><small id=m></small></div>`;
 $('#go').onclick=async()=>{const{data:r,error}=await db.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});if(error)return $('#m').textContent='Emel atau kata laluan salah.';uid=r.user.id;load()}}
async function load(){const{data}=await db.from('items').select('*').neq('kind','msg').order('created_at',{ascending:false});items=data||[];draw();badge();if(!me())profileForm()}
function draw(){clearInterval(poll);
 const M=['save','kids','recipe','wish','goal','exp','bill'];
 $('#nav').innerHTML=[['home','🏠','Utama'],['task','✅','Tugasan'],['event','📅','Tarikh'],['photo','📷','Gambar'],['recipe','✨','Lagi']].map(([k,i,n])=>`<button class="${tab==k||(k=='home'&&tab=='chat')||(k=='recipe'&&M.includes(tab))?'on':''}" onclick="tab='${k}';draw();scrollTo(0,0)"><i>${i}</i>${n}</button>`).join('');
 if(tab=='chat')poll=setInterval(chat,4000);
 tab=='home'?home():tab=='photo'?photos():tab=='event'?tarikh():tab=='bill'?bills():tab=='save'?sv():tab=='kids'?kids():tab=='wish'?wishes():tab=='goal'?goals():tab=='exp'?exps():tab=='chat'?chat(1):list(tab)}

const mini=x=>`<div class="card row" style="--a:${x.i.kind=='kev'?kidCol(x.i.data.kid):K[x.i.kind].a}"><div class=ic>${x.i.e||K[x.i.kind].e}</div><div class=grow><b>${esc(x.i.data.title)}</b><br><small>${x.i.kind=='kev'?esc(x.i.data.kid||'Program'):K[x.i.kind].n}</small></div><span class=pill>${when(x.n)}</span></div>`;
function card(i){if(i.kind=='task')return taskCard(i);const c=K[i.kind],d=i.data,n=nxt(i);
 return `<div class="card row" style="--a:${c.a}" onclick="${i.kind=='recipe'?`viewRecipe('${i.id}')`:`openForm('${i.kind}','${i.id}')`}"><div class=ic>${c.e}</div><div class=grow><b>${esc(d.title)}</b>`+
 (d.date?`<br><small>${d.date.split('-').reverse().join('/')}</small>`:'')+
 (/^https?:/.test(d.link||'')?`<br><a href="${esc(d.link)}" onclick="event.stopPropagation()">Buka sumber</a>`:'')+
 (d.body?`<pre>${esc(d.body.slice(0,110))}</pre>`:'')+`</div>`+(n?`<span class=pill>${when(n)}</span>`:'')+`</div>`}

function home(){const days=diff(today(),WED),ps=profs().map(p=>p.data),o=ps.find(p=>p.uid!=uid);
 const all=[...items,{kind:'event',e:'💍',data:{title:'Ulang tahun perkahwinan',date:'2018-03-18'}}];
 const up=all.map(i=>({i,n:nxt(i)})).filter(x=>x.n).sort((a,b)=>a.n-b.n);
 const td=up.filter(x=>diff(x.n,today())==0),co=up.filter(x=>diff(x.n,today())>0).slice(0,6);
 const tk=items.filter(i=>i.kind=='task'&&!i.data.done).slice(0,3);
 const def=`<h2>Tugasan</h2>`+(tk.map(taskCard).join('')||'<small>Semua selesai 🎉</small>')+`<h2>Hari ini</h2>`+(td.map(mini).join('')||'<small>Tiada apa-apa hari ini.</small>')+`<h2>Akan datang</h2>`+co.map(mini).join('');
 $('#app').innerHTML=`<div class=date>${new Date().toLocaleDateString(LC(),{weekday:'long',day:'numeric',month:'long'})}</div><h1>${ps.length?'Hai, '+ps.map(p=>esc(p.name)).join(' &amp; '):'Hai, kita'}</h1>`+
 `<div class=hero><div class=avs>${ps.map(p=>av(p,1)).join('')}</div><b>${days.toLocaleString('en-US')}</b><span>hari bersama</span><span style="display:block;margin-top:6px;font-size:15px">${ymd(WED,today())}</span></div>`+
 `<div class="card row" style="margin-top:14px" onclick="tab='chat';draw()"><div class=ic style="--a:var(--b)">💬</div><div class=grow><b>Chat${o?' dengan '+esc(o.name):''}</b><br><small id=lm>Tekan untuk berbual</small></div></div><div id=r>${def}</div>`;
 msgs(1).then(m=>{if(m[0]&&$('#lm'))$('#lm').textContent=m[0].data.text.slice(0,60)});}

function list(k){
 $('#app').innerHTML=(['recipe','bill'].includes(k)?chips():'')+`<h1>${K[k].n}</h1>`+(k=='task'&&window.Notification&&Notification.permission=='default'?'<small><a onclick="askBadge()">Aktifkan lencana pada ikon app</a></small>':'')+(items.filter(i=>i.kind==k).sort((a,b)=>!!a.data.done-!!b.data.done).map(card).join('')||'<small>Belum ada apa-apa. Tekan + untuk tambah.</small>')+`<button class=fab onclick="openForm('${k}')">+</button>`}

function openForm(k,id){const it=items.find(x=>x.id==id),d=it?.data||(k=='exp'?{date:iso(today()),who:me()?.data.name}:k=='event'?{date:tsel}:k=='sv'?{date:iso(today()),who:me()?.data.name,title:'Simpanan bulanan'}:k=='kev'?{kid:ck||items.find(i=>i.kind=='kid')?.data.title,date:kd}:{});
 sheet=document.createElement('div');sheet.className='sheet';
 sheet.innerHTML=`<div><h2 style="margin-top:0">${it?'Ubah':'Tambah'} ${K[k].n.toLowerCase()}</h2>`+K[k].f.map(([f,p,t,o])=>`<small>${p}</small>`+(t=='t'?`<textarea id=f_${f}>${esc(d[f])}</textarea>`:t=='p'?`<input id=f_${f} type=file accept="image/*">`:t=='s'?`<select id=f_${f}>${(o=='kids'?items.filter(i=>i.kind=='kid').map(i=>i.data.title):o||['',...profs().map(p=>p.data.name),'Kita berdua']).map(o=>`<option ${d[f]==o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id=f_${f} type="${t||'text'}" value="${esc(d[f])}">`)).join('')+
 `<button class=b id=sv>Simpan</button>`+(k=='event'&&it?`<button class="b g" id=ics>Masukkan ke Kalendar iPhone</button>`:'')+(k=='kev'&&it?`<button class="b g" id=kics>Masukkan ke Kalendar iPhone (dengan peringatan)</button>`:'')+(it?`<button class="b g" id=dl>Padam</button>`:'')+`<button class="b g" id=cl>Tutup</button></div>`;
 document.body.append(sheet);
 $('#cl').onclick=()=>sheet.remove();
 $('#sv').onclick=async()=>{const data={...d};for(const[f,,ty]of K[k].f){if(ty=='p'){const fl=$('#f_'+f).files[0];if(fl)data[f]=await dataUrl(fl)}else data[f]=$('#f_'+f).value.trim()}
  if(!data.title||(k=='event'&&!data.date)||(k=='sv'&&(!+data.amt||!data.date)))return alert('Sila isi tajuk dan tarikh.');
  const r=it?await db.from('items').update({data}).eq('id',id):await db.from('items').insert({kind:k,data});
  if(r.error)return alert('Gagal simpan: '+r.error.message);sheet.remove();load()};
 if($('#kics'))$('#kics').onclick=()=>ics([it]);
 if(it)$('#dl').onclick=async()=>{if(!confirm('Padam item ini?'))return;await db.from('items').delete().eq('id',id);sheet.remove();load()};
 if($('#ics'))$('#ics').onclick=()=>{const s=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Kita//MS\r\nBEGIN:VEVENT\r\nUID:${id}@kita\r\nDTSTAMP:20260101T000000Z\r\nDTSTART;VALUE=DATE:${d.date.replace(/-/g,'')}\r\nRRULE:FREQ=YEARLY\r\nSUMMARY:${d.title.replace(/[,;]/g,' ')}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Esok: ${d.title.replace(/[,;]/g,' ')}\r\nTRIGGER:-PT12H\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  location.href=URL.createObjectURL(new Blob([s],{type:'text/calendar'}))}}

const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b||f),'image/jpeg',.72)};i.onerror=()=>r(f);i.src=URL.createObjectURL(f)});
const rm=n=>'RM'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const chips=()=>`<div class=chips>`+[['kids','Anak'],['recipe','Resepi'],['wish','Impian'],['save','Simpanan'],['exp','Belanja'],['bill','Bil']].map(([k,n])=>`<button class="chip${tab==k?' on':''}" onclick="tab='${k}';draw()">${n}</button>`).join('')+`<button class=chip onclick="profileForm()">Profil</button></div>`;
const ka=k=>`<span class="kav${ck==k.data.title?' on':''}" data-n="${esc(k.data.title)}" style="background-color:${kidCol(k.data.title)};${k.data.photo?`background-image:url(${k.data.photo})`:''}">${k.data.photo?'':esc((k.data.title||'?')[0].toUpperCase())}</span>`;
let ck='',kd=iso(today()),km=new Date(today().getFullYear(),today().getMonth(),1);
const kidCol=n=>({Biru:'#2F7DE1','Merah jambu':'#FF6F91',Hijau:'#22A06B',Oren:'#F4A100',Ungu:'#7B61FF'})[items.find(i=>i.kind=='kid'&&i.data.title==n)?.data.color]||'var(--b)';

  const r=await db.from('items').update({data:{...i.data,pays:[...(i.data.pays||[]),{d,a}]}}).eq('id',id);if(r.error)return alert(r.error.message);sheet.remove();load()}}
async function delPay(id,key){if(!confirm('Padam rekod bayaran ini?'))return;const i=items.find(x=>x.id==id),ps=[...(i.data.pays||[])],k=ps.findIndex(p=>p.d+'|'+p.a==key);if(k<0)return;ps.splice(k,1);await db.from('items').update({data:{...i.data,pays:ps}}).eq('id',id);load()}
function badge(){try{const n=items.filter(i=>i.kind=='task'&&!i.data.done).length;if(!navigator.setAppBadge)return;n?navigator.setAppBadge(n):navigator.clearAppBadge()}catch(e){}}
async function askBadge(){if(!window.Notification)return alert('Lencana ikon hanya berfungsi bila app dipasang di Home Screen (Share, Add to Home Screen).');const r=await Notification.requestPermission();if(r!='granted')alert('Kebenaran tidak diberi. Boleh dihidupkan di Tetapan iPhone, Notifikasi, Kita.');badge();draw()}
async function subG(id){const i=items.find(x=>x.id==id),v0=+i.data.saved||0,v=parseFloat(prompt('Jumlah nak ditolak (RM):'));if(!(v>0))return;if(v>v0&&!confirm('Jumlah lebih daripada yang dikumpul ('+rm(v0)+'). Kosongkan semuanya?'))return;await db.from('items').update({data:{...i.data,saved:Math.max(0,v0-v)}}).eq('id',id);load()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&uid)load()});
function ymd(a,b){let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}return `${y} tahun ${m} bulan ${d} hari`}

function applyTheme(n){const t=TH[n]||TH.Ungu,r=document.documentElement.style;['--b','--b2','--bg1','--bg0','--h1','--h2','--h3','--ink','--mu'].forEach((p,i)=>r.setProperty(p,t[i]));document.querySelector('meta[name=theme-color]').content=t[2];try{localStorage.setItem('tema',n)}catch(e){}}
