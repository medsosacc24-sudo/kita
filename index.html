<!DOCTYPE html>
<html lang="ms"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DCEBFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kita">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<title>Kita</title>
<style>
:root{--b:#2F7DE1;--ink:#1B2A4A;--mu:#6B7A99}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 "DM Sans",system-ui,-apple-system,sans-serif;color:var(--ink);background-color:#F6F9FF;background-image:linear-gradient(180deg,#DCEBFF,#F6F9FF 380px);background-repeat:no-repeat;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(112px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:20px 18px}
h1,h2,.hero b{font-family:Fraunces,Georgia,serif}
h1{font-size:34px;line-height:1.1;font-weight:700;margin:4px 0 16px}
h2{font-size:24px;font-weight:700;margin:26px 0 12px}
.date{color:var(--mu);font-size:15px}
.card{background:#fff;border-radius:26px;padding:16px 18px;margin-bottom:12px;box-shadow:0 6px 22px #1b2a4a0f}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#7FB0FF,#A8A6FF 55%,#86D8E8);text-align:center;padding:36px 16px;border-radius:34px;box-shadow:0 14px 34px #2f7de12e}
.hero::after{content:"";position:absolute;right:-60px;top:-50px;width:230px;height:230px;border-radius:50%;background:#ffffff40}
.hero b{position:relative;z-index:1;display:block;font-size:74px;line-height:1.05;font-weight:700}
.hero span{position:relative;z-index:1}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ic{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--a) 15%,white);display:grid;place-items:center;font-size:20px;flex:none}
.pill{background:color-mix(in srgb,var(--a) 14%,white);color:var(--a);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:auto;display:flex;background:#fffffff2;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:34px;padding:6px;box-shadow:0 10px 30px #1b2a4a24}
nav button{flex:1;border:0;background:none;border-radius:26px;padding:8px 0;font:inherit;font-size:10.5px;color:var(--mu)}
nav button.on{background:#E4EEFF;color:var(--b);font-weight:700}
nav i{display:block;font-style:normal;font-size:19px}
input,textarea,select,.b{width:100%;font:inherit;padding:14px 16px;border:1px solid #dfe7f5;border-radius:18px;margin-bottom:10px;background:#fff;color:var(--ink)}
.search{border:0;border-radius:99px;padding:15px 22px;box-shadow:0 4px 18px #2f7de11a;margin-bottom:16px}
textarea{min-height:120px}
.b{background:var(--b);color:#fff;border:0;font-weight:700}
.g{background:#E4EEFF;color:var(--b)}
.fab{position:fixed;right:20px;bottom:calc(98px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:32px;box-shadow:0 8px 20px #2f7de155}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}
.sheet{position:fixed;inset:0;background:#1b2a4a88;display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:#F6F9FF;width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding:20px;margin:auto}
small{color:var(--mu)} pre{white-space:pre-wrap;font:inherit;font-size:14px;color:var(--mu)}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid #B7C6E3;background:#fff;flex:none;padding:0;display:grid;place-items:center;color:#fff;font-weight:700}
.chk.on{background:var(--b);border-color:var(--b)}
.av{width:38px;height:38px;border-radius:50%;background:#CFE0FF center/cover;color:var(--b);display:grid;place-items:center;font-weight:700;flex:none}
.av.big{width:68px;height:68px;border:3px solid #fff;font-size:26px;margin:0 -8px}
.avs{position:relative;z-index:1;display:flex;justify-content:center;margin-bottom:10px}
a{color:var(--b)}
</style></head>
<body><main id="app"></main><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WED=new Date(2018,2,18);
const K={
 event:{n:'Tarikh',e:'📅',a:'#2F7DE1',f:[['title','Tajuk (cth: Hari lahir isteri)'],['date','Tarikh (berulang setiap tahun)','date']]},
 recipe:{n:'Resepi',e:'🍳',a:'#E59A00',f:[['title','Nama resepi'],['link','Link sumber (pilihan)'],['body','Bahan dan langkah (salin dari post)','t']]},
 wish:{n:'Impian',e:'✈️',a:'#14A99B',f:[['title','Impian (cth: Jepun, kayak)'],['body','Nota','t']]},
 bill:{n:'Bil',e:'💳',a:'#7B61FF',f:[['title','Nama bil'],['day','Bayar pada hari ke- setiap bulan (1-31)','number'],['body','Rekod bayaran (cth: Nov 2026 - RM120)','t']]},
 task:{n:'Tugasan',e:'✅',a:'#22A06B',f:[['title','Tugasan (cth: Beli susu)'],['who','Untuk siapa','s']]}
};
let tab='home',items=[],sheet,uid,poll;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const diff=(a,b)=>Math.round((a-b)/864e5);
const when=n=>{const k=diff(n,today());return k==0?'Hari ini!':k==1?'Esok':k+' hari lagi'};
function nxt(i){const t=today(),d=i.data;let n;
 if(i.kind=='event'){if(!d.date)return;const o=new Date(d.date+'T00:00');n=new Date(t.getFullYear(),o.getMonth(),o.getDate());if(n<t)n.setFullYear(n.getFullYear()+1)}
 else if(i.kind=='bill'){const x=+d.day;if(!x)return;n=new Date(t.getFullYear(),t.getMonth(),x);if(n<t)n=new Date(t.getFullYear(),t.getMonth()+1,x)}
 return n}

async function init(){const{data:{session}}=await db.auth.getSession();uid=session?.user.id;session?load():login()}
function login(){$('#nav').innerHTML='';$('#app').innerHTML=`<h1>Kita</h1><div class=card><input id=e type=email placeholder="Emel"><input id=p type=password placeholder="Kata laluan"><button class=b id=go>Masuk</button><small id=m></small></div>`;
 $('#go').onclick=async()=>{const{data:r,error}=await db.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});if(error)return $('#m').textContent='Emel atau kata laluan salah.';uid=r.user.id;load()}}
async function load(){const{data}=await db.from('items').select('*').neq('kind','msg').order('created_at',{ascending:false});items=data||[];draw();if(!me())profileForm()}
function draw(){clearInterval(poll);
 const M=['more','recipe','wish','bill','chat'];
 $('#nav').innerHTML=[['home','🏠','Utama'],['task','✅','Tugasan'],['event','📅','Tarikh'],['photo','📷','Gambar'],['more','✨','Lagi']].map(([k,i,n])=>`<button class="${tab==k||(k=='more'&&M.includes(tab))?'on':''}" onclick="tab='${k}';draw();scrollTo(0,0)"><i>${i}</i>${n}</button>`).join('');
 if(tab=='chat')poll=setInterval(chat,4000);
 tab=='home'?home():tab=='photo'?photos():tab=='more'?more():tab=='chat'?chat(1):list(tab)}

const mini=x=>`<div class="card row" style="--a:${K[x.i.kind].a}"><div class=ic>${x.i.e||K[x.i.kind].e}</div><div class=grow><b>${esc(x.i.data.title)}</b><br><small>${K[x.i.kind].n}</small></div><span class=pill>${when(x.n)}</span></div>`;
function card(i){if(i.kind=='task')return taskCard(i);const c=K[i.kind],d=i.data,n=nxt(i);
 return `<div class="card row" style="--a:${c.a}" onclick="openForm('${i.kind}','${i.id}')"><div class=ic>${c.e}</div><div class=grow><b>${esc(d.title)}</b>`+
 (d.date?`<br><small>${d.date.split('-').reverse().join('/')}</small>`:'')+
 (/^https?:/.test(d.link||'')?`<br><a href="${esc(d.link)}" onclick="event.stopPropagation()">Buka sumber</a>`:'')+
 (d.body?`<pre>${esc(d.body.slice(0,110))}</pre>`:'')+`</div>`+(n?`<span class=pill>${when(n)}</span>`:'')+`</div>`}

function home(){const days=diff(today(),WED),ps=profs().map(p=>p.data),o=ps.find(p=>p.uid!=uid);
 const all=[...items,{kind:'event',e:'💍',data:{title:'Ulang tahun perkahwinan',date:'2018-03-18'}}];
 const up=all.map(i=>({i,n:nxt(i)})).filter(x=>x.n).sort((a,b)=>a.n-b.n);
 const td=up.filter(x=>diff(x.n,today())==0),co=up.filter(x=>diff(x.n,today())>0).slice(0,6);
 const tk=items.filter(i=>i.kind=='task'&&!i.data.done).slice(0,3);
 const def=`<h2>Tugasan</h2>`+(tk.map(taskCard).join('')||'<small>Semua selesai 🎉</small>')+`<h2>Hari ini</h2>`+(td.map(mini).join('')||'<small>Tiada apa-apa hari ini.</small>')+`<h2>Akan datang</h2>`+co.map(mini).join('');
 $('#app').innerHTML=`<div class=date>${new Date().toLocaleDateString('ms-MY',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${ps.length?'Hai, '+ps.map(p=>esc(p.name)).join(' &amp; '):'Hai, kita'}</h1><input class=search id=q placeholder="Cari semua...">`+
 `<div class=hero><div class=avs>${ps.map(p=>av(p,1)).join('')}</div><b>${days.toLocaleString('en-US')}</b><span>hari bersama</span></div>`+
 `<div class="card row" style="margin-top:14px" onclick="tab='chat';draw()"><div class=ic style="--a:#2F7DE1">💬</div><div class=grow><b>Chat${o?' dengan '+esc(o.name):''}</b><br><small id=lm>Tekan untuk berbual</small></div></div><div id=r>${def}</div>`;
 msgs(1).then(m=>{if(m[0]&&$('#lm'))$('#lm').textContent=m[0].data.text.slice(0,60)});
 $('#q').oninput=()=>{const v=$('#q').value.trim().toLowerCase();$('#r').innerHTML=v?(items.filter(i=>K[i.kind]&&JSON.stringify(i.data).toLowerCase().includes(v)).map(card).join('')||'<small>Tiada padanan.</small>'):def}}

function list(k){
 $('#app').innerHTML=`<h1>${K[k].n}</h1>`+(items.filter(i=>i.kind==k).sort((a,b)=>!!a.data.done-!!b.data.done).map(card).join('')||'<small>Belum ada apa-apa. Tekan + untuk tambah.</small>')+`<button class=fab onclick="openForm('${k}')">+</button>`}

function openForm(k,id){const it=items.find(x=>x.id==id),d=it?.data||{};
 sheet=document.createElement('div');sheet.className='sheet';
 sheet.innerHTML=`<div><h2 style="margin-top:0">${it?'Ubah':'Tambah'} ${K[k].n.toLowerCase()}</h2>`+K[k].f.map(([f,p,t])=>`<small>${p}</small>`+(t=='t'?`<textarea id=f_${f}>${esc(d[f])}</textarea>`:t=='s'?`<select id=f_${f}>${['',...profs().map(p=>p.data.name),'Kita berdua'].map(o=>`<option ${d[f]==o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id=f_${f} type="${t||'text'}" value="${esc(d[f])}">`)).join('')+
 `<button class=b id=sv>Simpan</button>`+(k=='event'&&it?`<button class="b g" id=ics>Masukkan ke Kalendar iPhone</button>`:'')+(it?`<button class="b g" id=dl>Padam</button>`:'')+`<button class="b g" id=cl>Tutup</button></div>`;
 document.body.append(sheet);
 $('#cl').onclick=()=>sheet.remove();
 $('#sv').onclick=async()=>{const data={...d};K[k].f.forEach(([f])=>data[f]=$('#f_'+f).value.trim());
  if(!data.title||(k=='event'&&!data.date))return alert('Sila isi tajuk dan tarikh.');
  const r=it?await db.from('items').update({data}).eq('id',id):await db.from('items').insert({kind:k,data});
  if(r.error)return alert('Gagal simpan: '+r.error.message);sheet.remove();load()};
 if(it)$('#dl').onclick=async()=>{if(!confirm('Padam item ini?'))return;await db.from('items').delete().eq('id',id);sheet.remove();load()};
 if($('#ics'))$('#ics').onclick=()=>{const s=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Kita//MS\r\nBEGIN:VEVENT\r\nUID:${id}@kita\r\nDTSTAMP:20260101T000000Z\r\nDTSTART;VALUE=DATE:${d.date.replace(/-/g,'')}\r\nRRULE:FREQ=YEARLY\r\nSUMMARY:${d.title.replace(/[,;]/g,' ')}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Esok: ${d.title.replace(/[,;]/g,' ')}\r\nTRIGGER:-PT12H\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  location.href=URL.createObjectURL(new Blob([s],{type:'text/calendar'}))}}

const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b||f),'image/jpeg',.72)};i.onerror=()=>r(f);i.src=URL.createObjectURL(f)});
async function photos(msg){
 $('#app').innerHTML=`<h1>Gambar</h1><small id=pe style="color:#d33">${esc(msg||'')}</small><div class=grid id=g></div><input id=up type=file accept="image/*" multiple hidden><button class=fab onclick="$('#up').click()">+</button>`;
 $('#up').onchange=async e=>{const fs=[...e.target.files],bad=[];
  for(let n=0;n<fs.length;n++){$('#pe').style.color='var(--mu)';$('#pe').textContent=`Memuat naik ${n+1}/${fs.length}...`;
   try{const b=await shrink(fs[n]);const{error}=await db.storage.from('photos').upload(Date.now()+'_'+n+Math.random().toString(36).slice(2,6)+'.jpg',b,{contentType:b.type||'image/jpeg'});if(error)bad.push(error.message)}catch(x){bad.push(String(x.message||x))}}
  photos(bad.length?'Gagal: '+bad[0]:'')};
 const{data,error}=await db.storage.from('photos').list('',{limit:300,sortBy:{column:'created_at',order:'desc'}});
 if(error)return $('#pe').textContent='Gagal papar gambar: '+error.message;
 const names=(data||[]).map(x=>x.name).filter(n=>n.endsWith('.jpg'));
 if(!names.length)return $('#g').outerHTML='<small>Belum ada gambar. Tekan + untuk muat naik.</small>';
 const{data:u,error:e2}=await db.storage.from('photos').createSignedUrls(names,3600);
 if(e2)return $('#pe').textContent='Gagal papar gambar: '+e2.message;
 $('#g').innerHTML=u.map(x=>x.signedUrl?`<img loading=lazy src="${x.signedUrl}" onclick="window.open(this.src)">`:'').join('')}

const profs=()=>items.filter(i=>i.kind=='profile');
const me=()=>profs().find(p=>p.data.uid==uid);
const av=(p,b)=>p?`<span class="av${b?' big':''}" style="${p.photo?`background-image:url(${p.photo})`:''}">${p.photo?'':esc((p.name||'?')[0])}</span>`:'';
function taskCard(i){const d=i.data,p=profs().find(x=>x.data.name==d.who)?.data;
 return `<div class="card row" style="--a:#22A06B"><button class="chk${d.done?' on':''}" onclick="tog('${i.id}')">${d.done?'✓':''}</button><div class=grow onclick="openForm('task','${i.id}')"><b style="${d.done?'text-decoration:line-through;opacity:.5':''}">${esc(d.title)}</b>${d.who?`<br><small>${esc(d.who)}</small>`:''}</div>${av(p)}</div>`}
async function tog(id){const i=items.find(x=>x.id==id);await db.from('items').update({data:{...i.data,done:!i.data.done}}).eq('id',id);load()}
const dataUrl=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(i.width,i.height),c=document.createElement('canvas');c.width=c.height=120;c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,120,120);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
function profileForm(){if($('.sheet'))return;const m=me()?.data||{};let ph=m.photo;
 sheet=document.createElement('div');sheet.className='sheet';
 sheet.innerHTML=`<div><h2 style="margin-top:0">Profil saya</h2><small>Nama</small><input id=pn value="${esc(m.name)}"><small>Gambar (pilihan)</small><input id=pp type=file accept="image/*"><button class=b id=ps>Simpan</button>${me()?'<button class="b g" id=pc>Tutup</button>':''}</div>`;
 document.body.append(sheet);
 if($('#pc'))$('#pc').onclick=()=>sheet.remove();
 $('#pp').onchange=async e=>{ph=await dataUrl(e.target.files[0])};
 $('#ps').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return alert('Sila isi nama.');const data={uid,name:n,photo:ph};
  const r=me()?await db.from('items').update({data}).eq('id',me().id):await db.from('items').insert({kind:'profile',data});
  if(r.error)return alert(r.error.message);sheet.remove();load()}}
function more(){$('#app').innerHTML=`<h1>Lagi</h1>`+[['recipe','🍳','Resepi','#E59A00'],['wish','✈️','Impian','#14A99B'],['bill','💳','Bil','#7B61FF'],['chat','💬','Chat','#2F7DE1']].map(([k,i,n,a])=>`<div class="card row" style="--a:${a}" onclick="tab='${k}';draw()"><div class=ic>${i}</div><b class=grow>${n}</b></div>`).join('')+`<div class="card row" style="--a:#2F7DE1" onclick="profileForm()"><div class=ic>👤</div><b class=grow>Profil saya</b></div><button class="b g" onclick="db.auth.signOut().then(login)">Log keluar</button>`}
const msgs=async(n=60)=>(await db.from('items').select('*').eq('kind','msg').order('created_at',{ascending:false}).limit(n)).data||[];
async function chat(first){
 if(!$('#ml')){$('#app').innerHTML=`<h1>Chat</h1><div id=ml></div><div style="height:70px"></div><div class=row style="position:fixed;left:18px;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:524px;margin:auto"><input id=mi placeholder="Tulis mesej..." style="margin:0"><button class=b style="width:auto;margin:0" id=ms>Hantar</button></div>`;$('#ms').onclick=send;$('#mi').onkeydown=e=>e.key=='Enter'&&send()}
 const m=(await msgs()).reverse(),mine=x=>x.data.uid==uid;
 $('#ml').innerHTML=m.map(x=>`<div style="display:flex;justify-content:${mine(x)?'flex-end':'flex-start'}"><div class=card style="margin-bottom:8px;padding:10px 15px;border-radius:20px;max-width:80%;${mine(x)?'background:var(--b);color:#fff':''}">${esc(x.data.text)}</div></div>`).join('')||'<small>Belum ada mesej.</small>';
 if(first)scrollTo(0,document.body.scrollHeight)}
async function send(){const t=$('#mi').value.trim();if(!t)return;$('#mi').value='';await db.from('items').insert({kind:'msg',data:{uid,text:t}});chat(1)}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
init();
</script></body></html>
